name: Upload iOS ipa to App Store Connect

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "放 .ipa 的那个 Release 的 tag"
        required: true

jobs:
  upload:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 从 Release 下载 ipa
        run: |
          mkdir -p build
          gh release download "${{ inputs.tag }}" --pattern "*.ipa" --dir build
          ls -lh build

      - name: 写入 App Store Connect API 私钥
        run: |
          mkdir -p ~/private_keys
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          chmod 600 ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: 上传到 App Store Connect
        run: |
          IPA=$(ls build/*.ipa | head -n 1)
          echo "上传：$IPA"
          xcrun altool --upload-app \
            -f "$IPA" \
            -t ios \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}" \
            --output-format json
